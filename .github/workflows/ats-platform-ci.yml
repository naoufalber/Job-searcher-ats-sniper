name: ATS platform CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'ats_sniper.py'
      - 'test_*.py'
      - '.github/workflows/ats-platform-ci.yml'
  push:
    branches: ['feature/**']
    paths:
      - 'apps/web/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'ats_sniper.py'
      - 'test_*.py'
      - '.github/workflows/ats-platform-ci.yml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:gemini:rate
      - run: npm run test:gemini:result
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
