name: ATS staging Gemini worker

on:
  workflow_run:
    workflows: ['ATS Job Sniper 24/7']
    branches: [main]
    types: [completed]
  schedule:
    # Offset from the quarter-hour burst; still runs every 15 minutes.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ats-staging-gemini
  cancel-in-progress: false

jobs:
  worker:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Drain matching queue at ten attempts per minute
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.ATS_STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ATS_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.ATS_STAGING_GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.ATS_STAGING_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_RATE_LIMIT_RPM: '10'
          # PostgreSQL enforces 450 attempts/day across keys and workers.
        run: node scripts/gemini-worker.mjs --drain --max-runtime-seconds 660
