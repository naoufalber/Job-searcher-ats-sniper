name: ATS Job Sniper 24/7

on:
  schedule:
    # S'exécute toutes les 5 minutes, 24h/24. GitHub peut toutefois décaler
    # une tâche planifiée en période de forte charge.
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permet aussi de le lancer manuellement en 1 clic

permissions:
  contents: write

# Un seul scan a la fois: evite les doublons Discord et les conflits git sur
# la base SQLite lorsqu'un lancement planifie chevauche un lancement manuel.
concurrency:
  group: ats-job-sniper
  cancel-in-progress: false

jobs:
  scan_jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 1. Récupération du code et de la base SQLite
        uses: actions/checkout@v4

      - name: 2. Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installation des dépendances
        run: pip install -r requirements.txt

      - name: Tests automatiques
        run: python -m unittest -v

      - name: 4. Exécution du Sniper ATS
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ATS_INGESTION_API_URL: ${{ secrets.ATS_STAGING_INGESTION_API_URL }}
          ATS_INGESTION_SHARED_SECRET: ${{ secrets.ATS_STAGING_INGESTION_SHARED_SECRET }}
          ATS_INGESTION_ENRICH_DETAILS: 'true'
          ATS_INGESTION_DETAIL_MAX_REQUESTS: '10'
          HELLOWORK_LOCATION: France
          HELLOWORK_MAX_PAGES: 2
          WTTJ_MAX_HITS: 200
        run: python ats_sniper.py

      - name: 5. Sauvegarde des offres vues (SQLite)
        run: |
          git config --global user.name "ATS Sniper Bot"
          git config --global user.email "bot@noreply.github.com"
          git add jobs_seen.db
          git diff --staged --quiet || git commit -m "Mise à jour de la base jobs_seen.db"
          git push
