name: Web application checks

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'supabase/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'supabase/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/matching-input.test.mjs tests/gemini.rate-limit.test.mjs tests/gemini.result.test.mjs tests/gemini.worker-mock.test.mjs tests/pdf.extract.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
